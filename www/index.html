<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AURUM Login</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      width:100%;
      min-height:100vh;
      background:#f5f5f5;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:380px;
      background:#ffffff;
      border-radius:25px;
      padding:25px;
      box-shadow:0 5px 25px rgba(0,0,0,0.12);
      text-align:center;
    }

    .logo{
      width:100%;
      max-width:240px;
      margin:auto;
      display:block;
      margin-bottom:25px;
      border-radius:12px;
    }

    .google-btn{
      width:100%;
      padding:13px;
      border:none;
      border-radius:12px;
      background:#ffffff;
      border:1px solid #cccccc;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      margin-bottom:18px;
      transition:0.3s;
    }

    .google-btn:hover{
      background:#f1f1f1;
    }

    .input-box{
      width:100%;
      margin-bottom:15px;
    }

    .input-box input{
      width:100%;
      padding:14px;
      border:2px solid #d4a017;
      border-radius:12px;
      font-size:16px;
      outline:none;
    }

    .input-box input:focus{
      border-color:#b8860b;
    }

    .signin-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#d4a017;
      color:#ffffff;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .signin-btn:hover{
      background:#b8860b;
    }

    .bottom-text{
      margin-top:18px;
      font-size:14px;
      color:#666;
    }

    .bottom-text a{
      color:#d4a017;
      text-decoration:none;
      font-weight:bold;
    }

    @media(max-width:480px){

      .container{
        padding:20px;
        border-radius:20px;
      }

      .logo{
        max-width:200px;
      }

      .google-btn,
      .signin-btn,
      .input-box input{
        font-size:15px;
      }

    }

  </style>
</head>
<body>

  <div class="container">

    <!-- Logo -->
    <img 
      src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg" 
      alt="Logo"
      class="logo"
    >

    <!-- Google Button -->
    <button class="google-btn">
      Continue with Google
    </button>

    <!-- Email -->
    <div class="input-box">
      <input 
        type="email" 
        placeholder="Enter Email"
        required
      >
    </div>

    <!-- Password -->
    <div class="input-box">
      <input 
        type="password" 
        placeholder="Enter Password"
        required
      >
    </div>

    <!-- Sign In -->
    <button class="signin-btn">
      Sign In
    </button>

    <!-- Bottom -->
    <div class="bottom-text">
      Don’t have an account?
      <a href="#">Register</a>
    </div>

  </div>

</body>
</html>

name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create package.json
        run: |
          echo '{
            "name": "goldenpay",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "latest",
              "@capacitor/cli": "latest",
              "@capacitor/android": "latest"
            },
            "devDependencies": {
              "typescript": "^5.0.0"
            }
          }' > package.json

      - name: Install dependencies
        run: npm install

      - name: Create Capacitor config
        run: |
          echo "module.exports = {
            appId: 'com.goldenpay.app',
            appName: 'Golden Pay',
            webDir: 'www',
            bundledWebRuntime: false
          };" > capacitor.config.js

      - name: Add Android
        run: npx cap add android

      - name: Copy Web Files
        run: npx cap copy

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: goldenpay-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
